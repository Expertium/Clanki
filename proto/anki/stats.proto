syntax = "proto3";

option java_multiple_files = true;

package anki.stats;

import "anki/generic.proto";
import "anki/cards.proto";
import "anki/deck_config.proto";

service StatsService {
  rpc CardStats(cards.CardId) returns (CardStatsResponse);
  rpc GetReviewLogs(cards.CardId) returns (ReviewLogs);
  rpc Graphs(GraphsRequest) returns (GraphsResponse);
  rpc GetGraphPreferences(generic.Empty) returns (GraphPreferences);
  rpc SetGraphPreferences(GraphPreferences) returns (generic.Empty);
}

// Implicitly includes any of the above methods that are not listed in the
// backend service.
service BackendStatsService {
  // The Stats page's Total Knowledge graph (spec ui.stats-total-knowledge).
  // It reads the collection, then replays FSRS-7 with the collection free,
  // so other collection work does not wait for the replay.
  rpc TotalKnowledge(TotalKnowledgeRequest) returns (TotalKnowledgeResponse);
  // The model-quality graphs' FSRS-7 predictions (spec
  // ui.stats-model-metrics). Like TotalKnowledge, it reads the collection and
  // then replays FSRS-7 with the collection free.
  rpc ReviewPredictions(ReviewPredictionsRequest)
      returns (ReviewPredictionsResponse);
}

message ReviewLogs {
  repeated CardStatsResponse.StatsRevlogEntry entries = 1;
}

message CardStatsResponse {
  message CardInfoRow {
    string label = 1;
    string value = 2;
  }
  message StatsRevlogEntry {
    int64 time = 1;
    RevlogEntry.ReviewKind review_kind = 2;
    uint32 button_chosen = 3;
    // seconds
    uint32 interval = 4;
    // per mill
    uint32 ease = 5;
    float taken_secs = 6;
    optional cards.FsrsMemoryState memory_state = 7;
    // seconds
    uint32 last_interval = 8;
  }
  repeated StatsRevlogEntry revlog = 1;
  int64 card_id = 2;
  int64 note_id = 3;
  string deck = 4;
  // Unix timestamps
  int64 added = 5;
  optional int64 first_review = 6;
  optional int64 latest_review = 7;
  optional int64 due_date = 8;
  optional int32 due_position = 9;
  // days
  uint32 interval = 10;
  // per mill
  uint32 ease = 11;
  uint32 reviews = 12;
  uint32 lapses = 13;
  float average_secs = 14;
  float total_secs = 15;
  string card_type = 16;
  string notetype = 17;
  optional cards.FsrsMemoryState memory_state = 18;
  // not set if due date/state not available
  optional float fsrs_retrievability = 19;
  string custom_data = 20;
  string preset = 21;
  optional string original_deck = 22;
  optional float desired_retention = 23;
  repeated float fsrs_params = 24;
  repeated CardInfoRow extra_rows = 25;
  // RWKV-Curve's forgetting curve after the card's last review, for a card
  // whose preset runs RWKV-Curve: recall at each elapsed time, and the
  // curve's S90. Present without points while RWKV has no curve for the card.
  message RwkvCurve {
    repeated float elapsed_days = 1;
    repeated float recall = 2;
    optional float s90 = 3;
    // the curve's recall now, since the card's last review
    optional float current_recall = 4;
    // True while RWKV cannot answer yet (its state is loading, or another
    // thread holds it). The curve arrives in a later request; card info asks
    // again on its own (spec ui.card-info-curve-messages).
    bool pending = 5;
  }
  optional RwkvCurve rwkv_curve = 26;
  // The collection's algorithm: card info shows only its values (spec
  // ui.card-info-one-algorithm).
  deck_config.DeckConfigsForUpdate.SchedulingAlgorithm scheduling_algorithm =
      27;
  // Simple mode shows no difficulty, stability or retrievability.
  bool advanced_ui = 28;
}

message GraphsRequest {
  // The parts of GraphsResponse a caller can ask for.
  enum Graph {
    ADDED = 0;
    REVIEWS = 1;
    TRUE_RETENTION = 2;
    FUTURE_DUE = 3;
    INTERVALS = 4;
    STABILITY = 5;
    EASES = 6;
    DIFFICULTY = 7;
    TODAY = 8;
    HOURS = 9;
    BUTTONS = 10;
    CARD_COUNTS = 11;
    RETRIEVABILITY = 12;
  }
  string search = 1;
  uint32 days = 2;
  // The graphs to compute; the response leaves the others unset. Empty =
  // every graph. The Stats page in Simple mode asks only for the graphs it
  // shows.
  repeated Graph graphs = 3;
  // For the media server: under RWKV, leave Retrievability out and say so
  // (the page then asks for it on its own), so that the other graphs do
  // not wait for RWKV to score every searched card. The backend ignores it.
  bool rwkv_retrievability_later = 4;
}

// Total Knowledge (spec ui.stats-total-knowledge): the search's cards over
// their whole review history, whatever the page's period.
message TotalKnowledgeRequest {
  string search = 1;
}

// One value per scheduler day, from first_day through today (day 0; days
// before today are negative).
message TotalKnowledgeResponse {
  deck_config.DeckConfigsForUpdate.SchedulingAlgorithm algorithm = 1;
  int32 first_day = 2;
  // The upper bound: cards rated at least once by that day.
  repeated uint32 reviewed_cards = 3;
  // FSRS-7 only: the sum of the cards' R. Empty under RWKV, whose sum comes
  // from TotalKnowledgeRwkvProgress.
  repeated double sum_r = 4;
}

// Starts (or joins) the RWKV computation of Total Knowledge's sum of R.
message TotalKnowledgeRwkvRequest {
  string search = 1;
  // RWKV-Curve's head; RWKV-Instant's otherwise.
  bool curve = 2;
}

message TotalKnowledgeRwkvJob {
  uint32 job_id = 1;
}

message TotalKnowledgeRwkvProgress {
  enum State {
    COMPUTING = 0;
    DONE = 1;
    NO_MODEL = 2;
    FAILED = 3;
    CANCELLED = 4;
  }
  State state = 1;
  uint32 job_id = 2;
  // The days computed so far, from first_day (as in TotalKnowledgeResponse):
  // the last of them is first_day + len(sum_r) - 1.
  int32 first_day = 3;
  repeated double sum_r = 4;
  string error = 5;
}

// The model-quality graphs' data (spec ui.stats-model-metrics): for every
// rating of the search's cards in the page's period that both models
// predicted without having been fitted on it, each model's predicted
// probability of recall before that answer, with the answer itself.
message ReviewPredictionsRequest {
  string search = 1;
  // The page's period in days; 0 = the whole history.
  uint32 days = 2;
}

message ReviewPredictionsResponse {
  // One entry per scored rating, oldest first. The four lists have the same
  // length: the models are scored on the same reviews, never on two
  // different sets.
  repeated int64 revlog_ids = 1;
  repeated int64 card_ids = 2;
  // The answers: true = Hard, Good or Easy, false = Again.
  repeated bool remembered = 3;
  repeated float fsrs_predictions = 4;
  // RWKV-Instant's head; RWKV-Curve has no stored per-review value yet.
  repeated float rwkv_predictions = 5;
  // The sample role each model's rows came from, such as "validation_fold";
  // empty when that model has no usable row. Roles are never mixed.
  string fsrs_role = 6;
  string rwkv_role = 7;
  // Ratings one model could score and the other could not, and ratings
  // neither could: the graph says how many it left out.
  uint32 fsrs_only = 8;
  uint32 rwkv_only = 9;
  uint32 unscored = 10;
  // The newest scored review, as a Unix timestamp in seconds, and the
  // number of later ratings of the search that no model has scored; the
  // graph says "predictions up to <date>; N newer reviews not scored".
  int64 newest_scored_secs = 11;
  uint32 newer_reviews = 12;
  // The calibration bins of each model over the scored ratings, in bin
  // order, empty bins left out (spec ui.stats-model-metrics).
  repeated CalibrationBin fsrs_bins = 13;
  repeated CalibrationBin rwkv_bins = 14;
  // True when two models have rows, so the ratings are the ones they
  // share; false when one model alone is scored, on all of its own
  // ratings, because one curve is not a comparison.
  bool shared_ratings = 15;
}

// One bin of the calibration graph: the ratings whose predicted probability
// falls in it (spec ui.stats-model-metrics).
message CalibrationBin {
  // 0 to 19, the bin's place on the x axis.
  uint32 index = 1;
  // The sums the graph divides by `count` to get the bin's mean predicted
  // probability and its share of remembered answers.
  double sum_predicted = 2;
  double sum_remembered = 3;
  uint32 count = 4;
  // The 2.5 and 97.5 percentiles of the bin's share of remembered answers,
  // from a bootstrap over cards; both 0 when the bin has no interval.
  double low = 5;
  double high = 6;
}

// Starts (or joins) the model-quality graphs' computation: FSRS-7's
// predictions from the backend, and RWKV's from a replay of the review
// history (spec ui.stats-model-metrics).
message ReviewMetricsRequest {
  string search = 1;
  // The page's period in days; 0 = the whole history.
  uint32 days = 2;
}

message ReviewMetricsJob {
  uint32 job_id = 1;
}

message ReviewMetricsProgress {
  enum State {
    COMPUTING = 0;
    DONE = 1;
    FAILED = 2;
    CANCELLED = 3;
  }
  // Why an algorithm has no series. It is never replaced by another
  // algorithm's values (spec ui.stats-model-metrics).
  enum Unavailable {
    AVAILABLE = 0;
    // No usable RWKV model.
    NO_MODEL = 1;
    // No preset of the searched cards has FSRS-7 parameters.
    NO_PARAMS = 2;
    // The search and period hold no rating this algorithm predicts.
    NO_REVIEWS = 3;
    // This build's RWKV cannot predict the algorithm's value per review.
    UNSUPPORTED = 4;
    // Still being computed.
    NOT_READY = 5;
  }
  message Series {
    deck_config.DeckConfigsForUpdate.SchedulingAlgorithm algorithm = 1;
    Unavailable unavailable = 2;
    // The ratings this algorithm predicted.
    uint32 reviews = 3;
    // The ROC curve, in order; the two lists have the same length.
    repeated float false_positive_rate = 4;
    repeated float true_positive_rate = 5;
    double auc = 6;
    // The sample role the predictions came from, such as
    // "validation_fold"; the graph names it, and roles are never mixed.
    string sample_role = 7;
    // The calibration graph's bins, in bin order, empty bins left out.
    repeated CalibrationBin bins = 8;
    // The mean predicted probability and the share of remembered answers
    // over every scored rating, for the panel's tiles.
    double average_predicted = 9;
    double actual_recall = 10;
  }
  State state = 1;
  uint32 job_id = 2;
  // One entry per algorithm, always all three, in menu order.
  repeated Series series = 3;
  string error = 4;
  // The ratings every drawn algorithm scored, and the ones left out:
  // scored by one algorithm only, or by neither.
  uint32 scored = 5;
  uint32 fsrs_only = 6;
  uint32 rwkv_only = 7;
  uint32 unscored = 8;
  // The newest scored review, as a Unix timestamp in seconds (0 = none),
  // and the ratings of the search after it that nothing has scored.
  int64 newest_scored_secs = 9;
  uint32 newer_reviews = 10;
  // True when two or more algorithms are drawn, so every curve is
  // restricted to the ratings they share.
  bool shared_ratings = 11;
}

message GraphsResponse {
  message Added {
    map<int32, uint32> added = 1;
  }
  message Intervals {
    map<uint32, uint32> intervals = 1;
  }
  message Eases {
    map<uint32, uint32> eases = 1;
    float average = 2;
  }
  message Retrievability {
    message Series {
      map<uint32, uint32> retrievability = 1;
      float average = 2;
      float sum_by_card = 3;
      float sum_by_note = 4;
    }
    map<uint32, uint32> retrievability = 1;
    float average = 2;
    float sum_by_card = 3;
    float sum_by_note = 4;
    Series fsrs = 5;
    Series rwkv = 6;
    // An RWKV collection whose RWKV scores for this search are not ready
    // yet: the page shows "Calculating…" (spec ui.stats-one-algorithm).
    bool rwkv_pending = 7;
  }
  message FutureDue {
    map<int32, uint32> future_due = 1;
    bool have_backlog = 2;
    uint32 daily_load = 3;
  }
  message Today {
    uint32 answer_count = 1;
    uint32 answer_millis = 2;
    uint32 correct_count = 3;
    uint32 mature_correct = 4;
    uint32 mature_count = 5;
    uint32 learn_count = 6;
    uint32 review_count = 7;
    uint32 relearn_count = 8;
    uint32 early_review_count = 9;
  }
  // each bucket is a 24 element vec
  message Hours {
    message Hour {
      uint32 total = 1;
      uint32 correct = 2;
    }
    repeated Hour one_month = 1;
    repeated Hour three_months = 2;
    repeated Hour one_year = 3;
    repeated Hour all_time = 4;
  }
  message ReviewCountsAndTimes {
    message Reviews {
      uint32 learn = 1;
      uint32 relearn = 2;
      uint32 young = 3;
      uint32 mature = 4;
      uint32 filtered = 5;
    }
    map<int32, Reviews> count = 1;
    map<int32, Reviews> time = 2;
  }
  // 4 element vecs for buttons 1-4
  message Buttons {
    message ButtonCounts {
      repeated uint32 learning = 1;
      repeated uint32 young = 2;
      repeated uint32 mature = 3;
    }
    ButtonCounts one_month = 1;
    ButtonCounts three_months = 2;
    ButtonCounts one_year = 3;
    ButtonCounts all_time = 4;
  }
  message CardCounts {
    message Counts {
      uint32 newCards = 1;
      uint32 learn = 2;
      uint32 relearn = 3;
      uint32 young = 4;
      uint32 mature = 5;
      uint32 suspended = 6;
      uint32 buried = 7;
    }
    // Buried/suspended cards are included in counts; suspended/buried counts
    // are 0.
    Counts including_inactive = 1;
    // Buried/suspended cards are counted separately.
    Counts excluding_inactive = 2;
  }
  message TrueRetentionStats {
    message TrueRetention {
      uint32 young_passed = 1;
      uint32 young_failed = 2;
      uint32 mature_passed = 3;
      uint32 mature_failed = 4;
    }

    TrueRetention today = 1;
    TrueRetention yesterday = 2;
    TrueRetention week = 3;
    TrueRetention month = 4;
    TrueRetention year = 5;
    TrueRetention all_time = 6;
  }

  Buttons buttons = 1;
  CardCounts card_counts = 2;
  Hours hours = 3;
  Today today = 4;
  Eases eases = 5;
  Eases difficulty = 11;
  Intervals intervals = 6;
  FutureDue future_due = 7;
  Added added = 8;
  ReviewCountsAndTimes reviews = 9;
  uint32 rollover_hour = 10;
  Retrievability retrievability = 12;
  bool fsrs = 13;
  Intervals stability = 14;
  TrueRetentionStats true_retention = 15;
  // The collection's algorithm: the page draws only its values (spec
  // ui.stats-one-algorithm).
  deck_config.DeckConfigsForUpdate.SchedulingAlgorithm scheduling_algorithm =
      16;
  // The collection-wide Advanced UI mode: Simple shows only some graphs
  // (spec ui.mode-switch); the page's switch changes it through the main
  // window, not through this message.
  bool advanced_ui = 17;
}

message GraphPreferences {
  enum Weekday {
    SUNDAY = 0;
    MONDAY = 1;
    FRIDAY = 5;
    SATURDAY = 6;
  }
  Weekday calendar_first_day_of_week = 1;
  bool card_counts_separate_inactive = 2;
  bool browser_links_supported = 3;
  bool future_due_show_backlog = 4;
}

message RevlogEntry {
  enum ReviewKind {
    LEARNING = 0;
    REVIEW = 1;
    RELEARNING = 2;
    FILTERED = 3;
    MANUAL = 4;
    RESCHEDULED = 5;
  }
  int64 id = 1;
  int64 cid = 2;
  int32 usn = 3;
  uint32 button_chosen = 4;
  int32 interval = 5;
  int32 last_interval = 6;
  uint32 ease_factor = 7;
  uint32 taken_millis = 8;
  ReviewKind review_kind = 9;
}

message CardEntry {
  int64 id = 1;
  int64 note_id = 2;
  int64 deck_id = 3;
}

message DeckEntry {
  int64 id = 1;
  int64 parent_id = 2;
  int64 preset_id = 3;
}

message Dataset {
  repeated RevlogEntry revlogs = 1;
  repeated CardEntry cards = 2;
  repeated DeckEntry decks = 3;
  int64 next_day_at = 4;
}
